<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partite di oggi</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#111;color:#eee;font-family:Arial,sans-serif}header{padding:12px;border-bottom:1px solid #333}h1{margin:0 0 6px;font-size:28px}#info{color:#aaa;font-size:16px}#status{padding:30px 12px;color:#aaa}#matches{max-width:1325px;margin:24px auto;padding:0 12px}.match{background:#181818;border:1px solid #333;border-radius:12px;margin-bottom:16px;overflow:hidden}.match-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #333}.league{color:#aaa;font-size:15px;margin-bottom:5px}.teams{font-size:23px;font-weight:bold}.time{font-size:24px;color:#bbb;white-space:nowrap;margin-left:20px}.servers{display:flex;flex-wrap:wrap;gap:7px;padding:14px 20px;background:#141414}.server-group{display:flex;align-items:center;gap:6px;margin-right:8px}.label{color:#bbb;font-size:16px}.server-btn{border:0;border-radius:6px;background:#303030;color:#fff;padding:10px 14px;font-size:16px;cursor:pointer}.server-btn:hover{background:#444}.empty{color:#888;padding:20px}@media(max-width:600px){.match-head{padding:13px}.teams{font-size:18px}.time{font-size:19px}.servers{padding:12px}}
</style>
</head>
<body>
<header><h1>Partite di oggi</h1><div id="info">Caricamento...</div></header>
<div id="status">Caricamento partite...</div><div id="matches"></div>
<script>
const JSON_URL="https://v2-gvtsch.pages.dev/sch.json";
function todayItaly(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Rome",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
function getParam(url,name){try{return new URL(url).searchParams.get(name)}catch(e){return null}}
function serverInfo(server,index){const url=server.url||"";const envivo=getParam(url,"envivo");if(envivo)return{type:"envivo",player:"https://cartelive.club/player/"+(index+1)+"/"+envivo};return{type:"other",player:url}}
function createButton(server,index){const info=serverInfo(server,index);const btn=document.createElement("button");btn.className="server-btn";btn.textContent=info.type==="envivo"?"S"+(index+1):(server.label||("S"+(index+1)));btn.onclick=()=>window.location.href=info.player;return btn}
function renderMatches(data){const today=todayItaly();const matches=data.filter(m=>{const date=m.match_date||m.kickoff_date;return date===today&&Array.isArray(m.servers)&&m.servers.length>0});matches.sort((a,b)=>{const ta=(a.match_time||a.kickoff_time||"99:99").replace(":","");const tb=(b.match_time||b.kickoff_time||"99:99").replace(":","");return Number(ta)-Number(tb)});document.getElementById("info").textContent=today+" · "+matches.length+" partite con stream";document.getElementById("status").style.display="none";const container=document.getElementById("matches");container.innerHTML="";if(!matches.length){container.innerHTML='<div class="empty">Nessuna partita con stream disponibile oggi.</div>';return}for(const match of matches){const card=document.createElement("div");card.className="match";const head=document.createElement("div");head.className="match-head";const left=document.createElement("div");const league=document.createElement("div");league.className="league";league.textContent=match.league||match.sport||"";const teams=document.createElement("div");teams.className="teams";teams.textContent=(match.team1?.name||"")+" - "+(match.team2?.name||"");left.appendChild(league);left.appendChild(teams);const time=document.createElement("div");time.className="time";time.textContent=match.match_time||match.kickoff_time||"";head.appendChild(left);head.appendChild(time);const servers=document.createElement("div");servers.className="servers";match.servers.forEach((server,index)=>{const group=document.createElement("div");group.className="server-group";const label=document.createElement("span");label.className="label";label.textContent=server.label||"";group.appendChild(label);group.appendChild(createButton(server,index));servers.appendChild(group)});card.appendChild(head);card.appendChild(servers);container.appendChild(card)}}
async function load(){try{const response=await fetch(JSON_URL,{cache:"no-store"});if(!response.ok)throw new Error("HTTP "+response.status);const data=await response.json();if(!Array.isArray(data))throw new Error("sch.json non contiene un array");renderMatches(data)}catch(err){document.getElementById("status").textContent="Errore nel caricamento di sch.json: "+err.message}}
load();setInterval(load,60000);
</script>
</body>
</html>
